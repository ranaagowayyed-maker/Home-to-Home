<section class="flex flex-col gap-10 py-6">
  <div class="flex flex-col gap-4 text-center sm:text-left">
    <p class="text-sm font-semibold tracking-wide text-brand-700 uppercase">From Home To Home</p>
    <h1 class="text-3xl font-bold text-balance sm:text-4xl">
      Homemade meals from the mothers in your neighborhood
    </h1>
    <p class="text-lg text-stone-600">
      Order real home cooking, sell the food you love to make, or deliver it — all in one place.
    </p>
    <div class="flex flex-col gap-3 sm:flex-row">
      <a
        routerLink="/signup"
        class="inline-flex min-h-11 items-center justify-center rounded-lg bg-brand-700 px-6 font-semibold text-white hover:bg-brand-800"
      >
        Sign up
      </a>
      <a
        routerLink="/login"
        class="inline-flex min-h-11 items-center justify-center rounded-lg border border-stone-300 bg-white px-6 font-semibold text-stone-800 hover:bg-stone-100"
      >
        Log in
      </a>
    </div>
  </div>

  <ul class="grid gap-3 sm:grid-cols-3">
    @for (card of roles; track card.role) {
      <li>
        <a
          routerLink="/signup"
          [queryParams]="{ role: card.role }"
          class="flex h-full flex-col gap-1 rounded-xl border border-stone-200 bg-white p-4 hover:border-brand-500"
        >
          <span class="font-semibold">{{ card.title }}</span>
          <span class="text-sm text-stone-600">{{ card.text }}</span>
        </a>
      </li>
    }
  </ul>
</section>
